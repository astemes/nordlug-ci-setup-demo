name: Build and Release
on:
  push:
    tags:
      - '*'
concurrency:
  group: nordlug
  cancel-in-progress: false
jobs:
  release:
    runs-on: nordlug
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Build Executable
        id: build_exe
        uses: astemes/astemes-github-actions/buildLVBuildSpecNonVersioned@main
        with:
          project-path: "project.lvproj"
          build-spec: "Application"
      - name: Release Executable
        uses: astemes/astemes-github-actions/releaseFile@main
        with:
          file-path: "${{ steps.build_exe.outputs.artifact-path }}"